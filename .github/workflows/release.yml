name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish self-contained single-file exe
        run: >
          dotnet publish CounterOverlay/CounterOverlay.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish

      - name: Package release zip
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          Compress-Archive -Path publish\CounterOverlay.exe -DestinationPath "CounterOverlay-$version-win-x64.zip"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            CounterOverlay-*.zip
            publish/CounterOverlay.exe
          draft: false
          generate_release_notes: true
